<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¿Dónde estoy? AMBA</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- PANTALLA DE INICIO -->
<div id="screen-intro" class="screen active">
  <div class="intro-content">
    <h1 class="game-title">¿Dónde estoy?</h1>
    <p class="game-subtitle">AMBA</p>
    <p class="intro-desc">
      Cinco cruces de calles del Área Metropolitana de Buenos Aires.<br>
      Tocá el mapa donde creés que están.
    </p>
    <div class="mode-buttons">
      <button class="btn-primary btn-hero" id="btn-start">AMBA</button>
      <div class="mode-row">
        <button class="btn-secondary" id="btn-start-caba">CABA</button>
        <button class="btn-secondary" id="btn-start-gba">GBA</button>
      </div>
    </div>
    <p class="intro-date" id="intro-date"></p>
  </div>
</div>

<!-- PANTALLA DE JUEGO -->
<div id="screen-game" class="screen">
  <div id="game-header">
    <div id="round-info">
      <span id="round-label">Ronda 1 de 5</span>
      <span id="round-multiplier" class="multiplier-badge"></span>
    </div>
    <div id="score-display">
      <span id="total-score">0</span>
      <span class="score-max" id="score-max">/1000</span>
    </div>
  </div>

  <div id="clue-bar">
    <div id="clue-icon">📍</div>
    <div id="clue-text">Cargando...</div>
  </div>

  <div id="map-container">
    <div id="map"></div>

    <!-- BOTÓN de confirmar arriesgada — aparece tras el primer toque -->
    <div id="confirm-overlay">
      <button class="btn-primary" id="btn-confirm">Confirmar</button>
      <button class="btn-cancel" id="btn-cancel-guess">✕</button>
    </div>

  </div>

  <!-- BARRA de resultado — fuera del mapa, siempre en el flujo normal -->
  <div id="result-bar" class="hidden">
    <div id="result-overlay-score">
      <span id="ro-pts">0</span>
      <span class="ro-label">pts</span>
    </div>
    <div id="result-overlay-info">
      <p id="ro-distance"></p>
      <p id="ro-street"></p>
      <p id="ro-mult"></p>
    </div>
    <button class="btn-next-inline" id="btn-next-round">→</button>
  </div>

  <div id="game-footer">
    <div id="guess-dots">
      <span class="dot" id="dot-1"></span>
      <span class="dot" id="dot-2"></span>
      <span class="dot" id="dot-3"></span>
      <span class="dot" id="dot-4"></span>
      <span class="dot" id="dot-5"></span>
    </div>
    <p class="map-hint">Tocá el mapa para marcar, luego confirmá</p>
  </div>
</div>

<!-- PANTALLA FINAL -->
<div id="screen-final" class="screen">
  <div class="final-content">
    <h2 class="game-title final-title">¿Dónde estoy? AMBA</h2>
    <div id="final-date-display"></div>
    <div id="final-total-score">
      <span id="final-score-number">0</span>
      <span id="final-score-max">/1000</span>
    </div>
    <div id="final-rounds-list"></div>

    <div id="ranking-section" class="hidden">
      <div class="ranking-header">
        <span class="ranking-title">Ranking</span>
        <div class="ranking-tabs">
          <button class="ranking-tab" data-mode="amba">AMBA</button>
          <button class="ranking-tab" data-mode="caba">CABA</button>
          <button class="ranking-tab" data-mode="gba">GBA</button>
        </div>
      </div>
      <div class="ranking-day-nav">
        <button class="ranking-nav-btn" id="ranking-prev">←</button>
        <span id="ranking-day-label">Hoy</span>
        <button class="ranking-nav-btn" id="ranking-next" disabled>→</button>
      </div>
      <div id="ranking-list"></div>
      <div id="ranking-save-row" class="hidden">
        <input type="text" id="ranking-name-input" placeholder="Tu nombre o apodo" maxlength="20" />
        <button class="btn-primary" id="btn-save-ranking">Guardar</button>
      </div>
    </div>

    <div id="final-buttons">
      <button class="btn-primary" id="btn-share">Compartir resultado</button>
      <button class="btn-secondary hidden" id="btn-back-menu">Volver al menú</button>
      <div id="share-copied" class="share-copied hidden">¡Copiado!</div>
    </div>
    <p class="final-note" id="final-note">Volvé mañana para cinco nuevos cruces.</p>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
<script src="game.js"></script>
</body>
</html>
